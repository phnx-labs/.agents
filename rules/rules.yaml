# agents-cli rules — single default preset
#
# Includes all subrules from `<repo>/rules/subrules/`.
# `mission` renders first (the product mission this fleet ladders up to — a placeholder
# here, replaced by the user layer's own `mission.md`), then `foundations`: the five
# principles (F1-F5) every tactic references.
# Linear tickets context is injected by hooks/03-linear-inject-tasks-context.sh.
# Release/publish discipline lives in each repository's canonical release process.

presets:
  default:
    subrules:
      - mission
      - foundations
      - research-discipline
      - fleet-delegation
      - code-quality
      - testing-strict
      - truly-agentic-git-workflow
      - gh-merge-guard
      - no-pr-footer
      - operational
      - conventions
      - agents-cli
      - parallel-teams
      - tech-stack
      - ui-work-discipline
      - plan-presentation
      - task-checklists
      - feed-status-posts
      - remote-fleet-dispatch
      - unattended-verification
