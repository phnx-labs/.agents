# agents-cli rules — single default preset
#
# Includes the subrules from `<repo>/rules/subrules/`, in render order.
# `foundations` renders first: the five principles (F1-F5) every tactic references.
# Linear tickets context is injected by hooks/03-linear-inject-tasks-context.sh.
# Release/publish discipline lives in each repository's canonical release process.

presets:
  default:
    subrules:
      - foundations
      - research-discipline
      - code-quality
      - truly-agentic-git-workflow
      - gh-merge-guard
      - operational
      - conventions
      - parallel-teams
      - feed-status-posts
      - ui-work-discipline
      - plan-presentation
