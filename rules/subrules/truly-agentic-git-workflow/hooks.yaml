# Hook bundled with the truly-agentic-git-workflow subrule. agents-cli folds this
# into the hook manifest (collectSubruleHooks) and registers it as a PreToolUse
# guard. The script resolves relative to this directory.
#
# One entry, one script, one combined matcher: the guard fires on Bash (to block
# `git commit|add`) and on the file tools (to block create/update/delete), and
# dispatches internally on tool_name.
# Co-located with this subrule (NOT under hooks/<event>/). agents-cli
# collectSubruleHooks rewrites script: to an absolute path under this dir.
main-branch-guard:
  script: main-branch-guard.sh
  events: [PreToolUse]
  matcher: "Bash|Write|Edit|MultiEdit|NotebookEdit"
  timeout: 5

# Nudges (satisfiable block, exit 2) when a `gh pr create|edit` body has no proof
# of a run (no screenshot/recording/asset) and no no-run declaration. Inspects the
# inline --body/-b AND the file behind --body-file/-F; fails OPEN on a
# --fill/--template/editor body or an unreadable body-file. Fires on Bash only.
pr-description-reminder:
  script: pr-description-reminder.sh
  events: [PreToolUse]
  matcher: Bash
  timeout: 5
  # Skipped in plan mode. Nothing opens a PR from a planning turn.
  # Uses permission_mode_not, not an enumerated permission_mode allowlist:
  # an allowlist stops matching when a harness renames a mode, which for a
  # guard means it silently stops guarding.
  matches:
    permission_mode_not: plan
