# Hooks bundled with the truly-agentic-git-workflow subrule. agents-cli
# collectSubruleHooks folds them into the manifest and rewrites script: to an
# absolute path under this dir.
#
# main-branch-guard.sh lives here too but is NOT registered here: agents.yaml
# registers it once, through hooks/pre-tool-use/main-branch-guard.sh, which
# execs this copy. Registering it in both places ran the guard twice on every
# tool call wherever the subrule's hooks were folded in.

# Nudges (satisfiable block, exit 2) when a `gh pr create|edit` body has no proof
# of a run (no screenshot/recording/asset) and no no-run declaration. Inspects the
# inline --body/-b AND the file behind --body-file/-F; fails OPEN on a
# --fill/--template/editor body or an unreadable body-file. Fires on Bash only.
pr-description-reminder:
  script: pr-description-reminder.sh
  events: [PreToolUse]
  matcher: Bash
  timeout: 5
