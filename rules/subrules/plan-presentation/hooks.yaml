# Hook bundled with the plan-presentation subrule. agents-cli folds this into the
# hook manifest (collectSubruleHooks) and registers it as a PreToolUse guard. The
# script resolves relative to this directory.
#
# Two entries share one script: PreToolUse catches native plan-exit tools early;
# Stop catches Codex and other harnesses whose plan mode has no exit tool. If no
# fresh valid plan HTML was rendered, it blocks once with a concrete correction.
# Co-located with this subrule (NOT under hooks/<event>/). agents-cli
# collectSubruleHooks rewrites script: to an absolute path under this dir.
plan-html-reminder:
  script: plan-html-reminder.sh
  events: [PreToolUse]
  matcher: "ExitPlanMode"
  timeout: 5

# Every Stop, in every mode: a plan turn gets the full plan check (Codex plan mode
# has no ExitPlanMode, so Stop is its seam), and any other turn that wrote a page
# into an artifact home must have opened it for the owner with browser show.
plan-html-stop-reminder:
  script: plan-html-reminder.sh
  events: [Stop]
  timeout: 5
