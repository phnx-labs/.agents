# Hooks bundled with the gh-merge-guard subrule. agents-cli folds these into
# the hook manifest (collectSubruleHooks) and registers them as PreToolUse(Bash)
# guards. Scripts resolve relative to this directory.
# Co-located with this subrule (NOT under hooks/<event>/). agents-cli
# collectSubruleHooks rewrites script: to an absolute path under this dir.
merge-guard:
  script: merge-guard.sh
  events: [PreToolUse]
  matcher: Bash
  timeout: 5
  # Skipped in plan mode. Nothing merges from a planning turn — `gh pr merge` is not a
  # planning action, so this cannot fire usefully in plan mode.
  # Uses permission_mode_not, not an enumerated permission_mode allowlist:
  # an allowlist stops matching when a harness renames a mode, which for a
  # guard means it silently stops guarding.
  matches:
    permission_mode_not: plan
