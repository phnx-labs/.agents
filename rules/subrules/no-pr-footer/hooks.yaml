# Hooks bundled with the no-pr-footer subrule. agents-cli folds these into the
# hook manifest (collectSubruleHooks) and registers them as PreToolUse(Bash)
# guards. Scripts resolve relative to this directory.
# Co-located with this subrule (NOT under hooks/<event>/). agents-cli
# collectSubruleHooks rewrites script: to an absolute path under this dir.
footer-guard:
  script: footer-guard.sh
  events: [PreToolUse]
  matcher: Bash
  timeout: 5
