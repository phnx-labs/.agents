name: pr-merge-on-green
# Opt-in built-in: no `enabled:` field, so the system layer keeps it DISABLED
# until `agents monitors enable pr-merge-on-green`. A user copy under
# ~/.agents/monitors/ shadows this file and can turn it on per box.
description: >-
  Rebase-merge this machine's own pull requests once CI is green and a
  non-author has approved them. Polls every 5 minutes across GitHub for your
  open PRs that are both CI-green and verdict-cleared (a GitHub APPROVED
  review or an APPROVE comment on the same PR), then dispatches an agent to
  merge each.

source:
  type: poll
  interval: 5m
  # Cwd-independent (RUSH-2848): the daemon evaluates this from a non-repo
  # directory, so the helper never calls `gh pr list` without `--repo`. It
  # lists via `gh search prs` and inspects each candidate with
  # `gh pr view --repo <owner/name>`. Verdict is pr-verdict.py — the same
  # check merge-guard.sh uses. AGENTS_SYSTEM_MONITORS_DIR is the CLI's existing
  # system-monitors override; unset, this is ~/.agents/.system/monitors/.
  command: >-
    sh "${AGENTS_SYSTEM_MONITORS_DIR:-$HOME/.agents/.system/monitors}/pr-merge-on-green.sh"

condition:
  # Fire every 5-minute tick that reports at least one mergeable PR. `mode: every`
  # skips an empty observation (no mergeable PR -> silent), so this fires only when
  # the list is non-empty — but unlike `match`, it re-fires while the SAME PR is
  # still listed. That is the point (RUSH-2488): if a dispatched merge fails
  # silently (transient gh error, box down, agent crashes before merging), the PR
  # stays approved+green and shows up again next tick, so the merge is retried
  # rather than stranded until some other PR incidentally re-triggers. `rateLimit`
  # below caps the retries. Requires agents-cli >= 1.22.36 (empty-safe `every`,
  # phnx-labs/agents-cli#2536); on an older CLI `every` would also fire on an empty
  # poll, so do not enable this before that version is installed.
  mode: every

action:
  type: run
  agent: claude
  mode: auto
  # Worded without a literal `gh pr merge` / `--admin` so registering or editing
  # this monitor does not trip merge-guard (RUSH-2760 false positives on quoted
  # prompt text). The dispatched agent still rebase-merges via the GitHub CLI.
  prompt: >-
    These pull requests are CI-green and carry a non-author APPROVE verdict on
    the same PR (a GitHub APPROVED review or an APPROVE comment, not a verdict
    carried from another PR): {event}. Each entry is owner/repo#number.
    Rebase-merge each through the GitHub CLI, deleting the branch after.
    Never bypass branch protection, never self-approve. If a merge conflicts
    or CI flipped red, stop and report.

# Firehose guard: if a PR keeps churning (CI flaps, a conflict the agent can't
# resolve), auto-pause rather than dispatch a merge agent on a loop.
rateLimit:
  max: 6
  per: 1h
