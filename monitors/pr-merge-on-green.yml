name: pr-merge-on-green
# Opt-in built-in: no `enabled:` field, so the system layer keeps it DISABLED
# until `agents monitors enable pr-merge-on-green`. A user copy under
# ~/.agents/monitors/ shadows this file and can turn it on per box.
description: >-
  Rebase-merge this machine's own pull requests once CI is green and a
  non-author has approved them. Polls every 5 minutes for your open PRs that
  are both CI-green and APPROVED, then dispatches an agent to merge each.

source:
  type: poll
  interval: 5m
  # One `gh pr list` per poll (no per-PR loop, so it stays rate-limit friendly):
  # list your open PRs with their review decision + check rollup, keep only the
  # APPROVED ones whose every check is SUCCESS/NEUTRAL/SKIPPED, and print their
  # numbers on one line. reviewDecision is APPROVED only when a NON-author has
  # approved (GitHub never lets you approve your own PR). Empty output (no
  # mergeable PR) is a silent observation under the `mode: every` condition
  # below, so nothing fires.
  command: >-
    gh pr list --author @me --state open --limit 50
    --json number,reviewDecision,statusCheckRollup
    --jq '.[] | select(.reviewDecision == "APPROVED")
    | select(all(.statusCheckRollup[]?;
    (.conclusion // .state // .status // "") | ascii_upcase
    | . == "SUCCESS" or . == "NEUTRAL" or . == "SKIPPED")) | .number'
    | tr '\n' ' '

condition:
  # Fire every 5-minute tick that reports at least one mergeable PR. `mode: every`
  # skips an empty observation (no mergeable PR -> silent), so this fires only when
  # the list is non-empty — but unlike `match`, it re-fires while the SAME PR is
  # still listed. That is the point (RUSH-2488): if a dispatched merge fails
  # silently (transient gh error, box down, agent crashes before merging), the PR
  # stays approved+green and shows up again next tick, so the merge is retried
  # rather than stranded until some other PR incidentally re-triggers. `rateLimit`
  # below caps the retries. Requires agents-cli >= 1.22.36 (empty-safe `every`,
  # phnx-labs/agents-cli#2536); on an older CLI `every` would also fire on an empty
  # poll, so do not enable this before that version is installed.
  mode: every

action:
  type: run
  agent: claude
  mode: auto
  prompt: >-
    These PRs are CI-green and non-author-approved: {event}. Rebase-merge each
    with `gh pr merge <n> --rebase --delete-branch`. Never use `--admin`, never
    self-approve. If a merge conflicts or CI flipped red, stop and report.

# Firehose guard: if a PR keeps churning (CI flaps, a conflict the agent can't
# resolve), auto-pause rather than dispatch a merge agent on a loop.
rateLimit:
  max: 6
  per: 1h
