  # Git prefixes retained for readable translated policies. The blanket Bash rule
  # in 30-paths allows every Git command at the permission layer; cooperative hooks
  # may still refuse recognized destructive forms.
  - "Bash(git status:*)"
  - "Bash(git diff:*)"
  - "Bash(git log:*)"
  - "Bash(git show:*)"
  - "Bash(git remote:*)"
  - "Bash(git ls-files:*)"
  - "Bash(git cat-file:*)"
  - "Bash(git rev-parse:*)"
  - "Bash(git describe:*)"
  - "Bash(git shortlog:*)"
  - "Bash(git blame:*)"
  - "Bash(git tag:*)"
  - "Bash(git check-ignore:*)"
  - "Bash(git ls-tree:*)"
  - "Bash(git add:*)"
  - "Bash(git commit:*)"
  - "Bash(git push:*)"
  - "Bash(git clone:*)"
  - "Bash(git fetch:*)"
  - "Bash(git worktree list:*)"
  - "Bash(git worktree add:*)"
  - "Bash(git worktree remove:*)"
  - "Bash(git rm:*)"
  - "Bash(git mv:*)"
  - "Bash(git restore:*)"
  - "Bash(git diff-tree:*)"
  - "Bash(git for-each-ref:*)"
  - "Bash(git symbolic-ref:*)"
