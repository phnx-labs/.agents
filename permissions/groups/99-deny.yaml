deny:
  # File-tool accidental-access controls. Allowed Bash can still reach these paths.
  - "Read(~/.ssh/**)"
  - "Edit(~/.ssh/**)"
  - "Write(~/.ssh/**)"
  - "Read(~/.aws/credentials)"
  - "Edit(~/.aws/credentials)"
  - "Write(~/.aws/credentials)"
  - "Read(~/.aws/config)"
  - "Edit(~/.aws/config)"
  - "Write(~/.aws/config)"
  - "Read(~/.config/gcloud/**)"
  - "Edit(~/.config/gcloud/**)"
  - "Write(~/.config/gcloud/**)"
  - "Read(~/.config/op/**)"
  - "Edit(~/.config/op/**)"
  - "Write(~/.config/op/**)"
  - "Read(~/.netrc)"
  - "Edit(~/.netrc)"
  - "Write(~/.netrc)"
  - "Read(~/.pgpass)"
  - "Edit(~/.pgpass)"
  - "Write(~/.pgpass)"
  - "Read(~/.docker/config.json)"
  - "Edit(~/.docker/config.json)"
  - "Write(~/.docker/config.json)"
  - "Read(~/.npmrc)"
  - "Edit(~/.npmrc)"
  - "Write(~/.npmrc)"
  - "Read(~/.kube/config)"
  - "Edit(~/.kube/config)"
  - "Write(~/.kube/config)"
  - "Read(~/.codex/auth.json)"
  - "Edit(~/.codex/auth.json)"
  - "Write(~/.codex/auth.json)"
  - "Read(~/.claude/*.json)"
  - "Edit(~/.claude/*.json)"
  - "Write(~/.claude/*.json)"
