  # Python — interpreters, package managers, formatters, test runners.
  - "Bash(python:*)"
  - "Bash(python3:*)"
  - "Bash(pip:*)"
  - "Bash(pip3:*)"
  - "Bash(uv:*)"
  - "Bash(uvx:*)"
