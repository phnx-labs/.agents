  - "Bash(rustc:*)"
  - "Bash(rustup:*)"
  - "Bash(rustfmt:*)"
  - "Bash(clippy-driver:*)"
  # Docker / container runtime — read-only and build/run.
  # Privileged operations (e.g. `docker system prune -af`) fall through to prompt.
  - "Bash(docker:*)"
  - "Bash(docker-compose:*)"
  - "Bash(podman:*)"
  - "Bash(colima:*)"
  - "Bash(buildx:*)"
  # Kubernetes / Helm.
