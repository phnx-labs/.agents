  # Git — read-only + commit/push/clone/fetch/worktree.
  # Normal branch creation/switching is denied; use git worktree add -b under
  # <repo>/.agents/worktrees/<slug>/ for PR-bound coding work.
  # Destructive operations (reset, checkout, switch, branch, stash, rebase, cherry-pick,
  # revert, clean, reflog, filter-branch, gc, prune, fsck, force-push) are denied
  # in 99-deny.yaml.
  - "Bash(git status:*)"
  - "Bash(git diff:*)"
  - "Bash(git log:*)"
  - "Bash(git show:*)"
  - "Bash(git remote:*)"
  - "Bash(git ls-files:*)"
  - "Bash(git cat-file:*)"
  - "Bash(git rev-parse:*)"
  - "Bash(git describe:*)"
  - "Bash(git shortlog:*)"
  - "Bash(git blame:*)"
  - "Bash(git tag:*)"
  - "Bash(git check-ignore:*)"
  - "Bash(git ls-tree:*)"
  - "Bash(git add:*)"
  - "Bash(git commit:*)"
  - "Bash(git push:*)"
  - "Bash(git clone:*)"
  - "Bash(git fetch:*)"
  - "Bash(git worktree list:*)"
  - "Bash(git worktree add:*)"
  - "Bash(git worktree remove:*)"
  - "Bash(git rm:*)"
  - "Bash(git mv:*)"
  - "Bash(git restore:*)"
  - "Bash(git diff-tree:*)"
  - "Bash(git for-each-ref:*)"
  - "Bash(git symbolic-ref:*)"
  # Merging a PR. Without this narrow rule, auto mode refuses it as
  # [Merge Without Review] and the agent hands the merge to the owner.
  - "Bash(gh pr merge:*)"
  # Security tooling — SSH client, GPG, SSL inspection (read-only).
  - "Bash(ssh:*)"
  - "Bash(scp:*)"
  - "Bash(rsync:*)"
  - "Bash(gpg:*)"
  - "Bash(ssh-keygen:*)"
  - "Bash(ssh-add:*)"
  - "Bash(ssh-keyscan:*)"
  - "Bash(openssl:*)"
  - "Bash(certutil:*)"
  - "Bash(keytool:*)"
  # CI / build orchestration.
  - "Bash(make:*)"
  - "Bash(just:*)"
  - "Bash(task:*)"
  - "Bash(gradle:*)"
  - "Bash(gradlew:*)"
  - "Bash(./gradlew:*)"
  - "Bash(mvn:*)"
  - "Bash(bazel:*)"
  - "Bash(buck:*)"
  - "Bash(buck2:*)"
  - "Bash(act:*)"
  # self — agent self-operations (the `self` plugin, /self:close).
  # SIGTERM to the harness (the Bash tool shell's own parent) is how an agent
  # ends its own session cleanly. Scoped to this ONE exact form — the direct
  # parent, TERM only — never a general `kill` allow. /self:close runs a
  # read-only `ps -o comm= -p $PPID` guard first (covered by the core `ps` allow)
  # so it never signals a shell/tmux/sshd parent. `/self:close` is the only
  # command that uses this exact form.
  - "Bash(kill -TERM $PPID)"
  # Networking, archives, profiling — generally safe day-to-day commands.
  # rm, mv, cp, chmod, chown, ln, mkdir, touch are deliberately not auto-approved
  # so they fall through to a user prompt.
  - "Bash(curl:*)"
  - "Bash(wget:*)"
  - "Bash(http:*)"
  - "Bash(httpie:*)"
  - "Bash(find:*)"
  - "Bash(ping:*)"
  - "Bash(dig:*)"
  - "Bash(host:*)"
  - "Bash(nslookup:*)"
  - "Bash(traceroute:*)"
  - "Bash(netstat:*)"
  - "Bash(lsof:*)"
  - "Bash(ps:*)"
  - "Bash(top:*)"
  - "Bash(htop:*)"
  - "Bash(time:*)"
  - "Bash(tar:*)"
  - "Bash(zip:*)"
  - "Bash(unzip:*)"
  - "Bash(gzip:*)"
  - "Bash(gunzip:*)"
  - "Bash(diff:*)"
  - "Bash(comm:*)"
  - "Bash(tee:*)"
  - "Bash(xargs:*)"
  - "Bash(sleep:*)"
  - "Bash(brew:*)"
  - "Bash(direnv:*)"
  # Read is allow-listed broadly so agents can inspect any file in the project,
  # including dotfiles and config. Credential paths (~/.ssh, ~/.aws/credentials,
  # ~/.config/gcloud, ~/.netrc, ~/.pgpass, ~/.docker/config.json, ~/.npmrc) are
  # explicitly denied in 99-deny.yaml.
  - "Read"

  # Write/Edit is scoped: scratch space + the agents-cli config dirs.
  # Project-level edits (cwd) require explicit user approval.
  - "Write(/tmp/*)"
  - "Write(/tmp/**)"
  - "Edit(/tmp/*)"
  - "Edit(/tmp/**)"
  - "Edit(~/.claude.json)"
  - "Write(~/.claude/*)"
  - "Write(~/.claude/**)"
  - "Edit(~/.claude/*)"
  - "Edit(~/.claude/**)"
  - "Write(~/.agents/*)"
  - "Write(~/.agents/**)"
  - "Edit(~/.agents/*)"
  - "Edit(~/.agents/**)"
deny:
  # Sandbox-only deny list. Applied when AGENTS_PERMISSION_PRESET=sandbox.
  #
  # Philosophy: the pod is ephemeral and non-root. Only block operations whose
  # blast radius escapes the pod (remote git state, credentials that unlock
  # external systems). Everything else — find, sudo, wget, local git ops —
  # is allowed, because a destructive local command just destroys scratch state.

  # Remote blast radius — affects the shared git remote
  - "Bash(git push --force:*)"
  - "Bash(git push -f:*)"
  - "Bash(git filter-branch:*)"

  # Credentials — unlock remote systems even from a dead pod
  - "Read(~/.ssh/**)"
  - "Edit(~/.ssh/**)"
  - "Read(~/.codex/auth.json)"
  - "Edit(~/.codex/auth.json)"
  - "Read(~/.claude/*.json)"
  - "Edit(~/.claude/*.json)"
deny:
  - "Bash(sudo:*)"

  # Artifacts are artifacts-cli pages or hand-written HTML opened for the owner.
  # A harness's own page publisher (claude.ai Artifacts) is never the place for them.
  - "Artifact"
  - "ArtifactComments"
  - "ArtifactData"

  # Credential files — never allow agents to read or write these.
  - "Read(~/.ssh/**)"
  - "Edit(~/.ssh/**)"
  - "Write(~/.ssh/**)"
  - "Read(~/.aws/credentials)"
  - "Edit(~/.aws/credentials)"
  - "Write(~/.aws/credentials)"
  - "Read(~/.aws/config)"
  - "Edit(~/.aws/config)"
  - "Read(~/.config/gcloud/**)"
  - "Edit(~/.config/gcloud/**)"
  - "Write(~/.config/gcloud/**)"
  - "Read(~/.config/op/**)"
  - "Edit(~/.config/op/**)"
  - "Read(~/.netrc)"
  - "Edit(~/.netrc)"
  - "Write(~/.netrc)"
  - "Read(~/.pgpass)"
  - "Edit(~/.pgpass)"
  - "Write(~/.pgpass)"
  - "Read(~/.docker/config.json)"
  - "Edit(~/.docker/config.json)"
  - "Read(~/.npmrc)"
  - "Edit(~/.npmrc)"
  - "Read(~/.kube/config)"
  - "Edit(~/.kube/config)"

  # Git - dangerous commands that rewrite history or lose work.
  # `git push --force` is blocked; `--force-with-lease` is permitted because
  # it refuses to overwrite if the remote has advanced.
  - "Bash(git reset:*)"
  - "Bash(git push --force:*)"
  - "Bash(git push -f:*)"
  - "Bash(git clean:*)"
  - "Bash(git checkout:*)"
  - "Bash(git switch:*)"
  - "Bash(git branch:*)"
  - "Bash(git merge --abort:*)"
  - "Bash(git revert:*)"
  - "Bash(git cherry-pick:*)"
  - "Bash(git reflog:*)"
  - "Bash(git filter-branch:*)"
  - "Bash(git gc:*)"
  - "Bash(git prune:*)"
  - "Bash(git fsck:*)"
  - "Bash(git stash:*)"
  - "Bash(git branch -D:*)"
  # git config — deny only the dangerous WRITE forms (hook hijack / alias
  # injection / global-scope writes). The old blanket `git config:*` deny also
  # blocked read-only `git config --get` / `--list`; these three targeted denies
  # stop that over-blocking. All git config WRITES remain blocked: git-guard.sh
  # independently hard-denies every write regardless of these permission rules,
  # so the effective gate is unchanged. `git -C <path> config` can still evade
  # a token-prefix deny; git-guard is the real backstop.
  - "Bash(git config --global:*)"
  - "Bash(git config core.hooksPath:*)"
  - "Bash(git config alias:*)"
