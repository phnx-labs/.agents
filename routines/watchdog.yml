# Built-in routine: nudge stalled agent sessions (RUSH-2353).
#
# Migrated off a hardcoded daemon setInterval (WATCHDOG_TICK_MS, 3 min) so it is
# declared, listed, run-tracked, pausable, and device-pinnable like every other
# routine, instead of a second unowned scheduling path inside runDaemon().
#
# `command:`, not an agent — deterministic housekeeping (poll live sessions,
# inject a nudge into a stalled one), no LLM judgment needed. The tick itself
# still honors the `watchdog.enabled` device config gate and no-ops when it's
# off, so disabling the feature via `agents watchdog off` still works exactly
# as before; this routine just supplies the clock.
#
# Users override it with a same-named file in ~/.agents/routines/, or disable
# it with `agents routines disable watchdog`.
name: watchdog
schedule: "*/3 * * * *"
enabled: true
timeout: 2m
command: agents __daemon-tick watchdog
