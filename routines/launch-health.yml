# Built-in routine: probe that each agent's DEFAULT version actually LAUNCHES,
# and repair a gutted install before the user's next `agents run` dies with a
# raw ENOENT (RUSH-2353).
#
# Migrated off a hardcoded daemon setInterval (6h). Never repoints the global
# default (allowDefaultSwitch: false) — a background default switch would be a
# silent logout, so an unhealed version is reported, not auto-switched.
#
# Users override it with a same-named file in ~/.agents/routines/, or disable
# it with `agents routines disable launch-health`.
name: launch-health
schedule: "0 */6 * * *"
enabled: true
timeout: 5m
command: agents __daemon-tick launch-health
