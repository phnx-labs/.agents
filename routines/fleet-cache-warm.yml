# Built-in routine: publish THIS host's row for the caches `agents fleet
# status` / `agents devices list` read (RUSH-2353).
#
# Migrated off a hardcoded daemon setInterval (3 min). PUBLISH-OWN / READ-UNION
# (RUSH-2061): each box probes only itself and never SSHes another device, so
# the fleet does not pay an N^2 SSH resource-probe cost. Cross-host rows are
# unioned on demand by the reader (`agents fleet status`).
#
# Users override it with a same-named file in ~/.agents/routines/, or disable
# it with `agents routines disable fleet-cache-warm`.
name: fleet-cache-warm
schedule: "*/3 * * * *"
enabled: true
timeout: 2m
command: agents __daemon-tick fleet-cache-warm
