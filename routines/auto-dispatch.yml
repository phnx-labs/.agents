# Built-in routine: pick up Linear tickets delegated to an agent and still in
# Todo, and dispatch each through agents-cli's own cloud-provider layer
# (RUSH-2353).
#
# Migrated off a hardcoded daemon setInterval (3 min) — the priority migration
# in RUSH-2353, because as a hardcoded tick it could not be pinned to one
# device, and every daemon on a fleet independently polled the same shared
# Linear queue with no coordination (the shared-input double-fire problem).
# As a routine it inherits the `devices:` allowlist; pin it to exactly one
# device with:
#
#   agents routines devices auto-dispatch --set <device>
#
# OFF unless a project opts in (autoDispatch:true + maxAgents>0 in
# ~/.agents/factory/projects.json); no opted-in project or no LINEAR_API_KEY is
# a clean no-op — so shipping this unrestricted is safe on a fresh install.
#
# Users override it with a same-named file in ~/.agents/routines/, or disable
# it with `agents routines disable auto-dispatch`.
name: auto-dispatch
schedule: "*/3 * * * *"
enabled: true
timeout: 2m
command: agents __daemon-tick auto-dispatch
