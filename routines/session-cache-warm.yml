# Built-in routine: publish THIS host's local active sessions so menubar /
# Factory / watchdog / CLI share one warm snapshot instead of each re-running a
# full ~9s / ~170MB gather (RUSH-2062, RUSH-2353).
#
# Migrated off a hardcoded daemon setInterval (3 min). Publish-own only — no
# cross-host SSH, same N^2 lesson as fleet-cache-warm.
#
# Users override it with a same-named file in ~/.agents/routines/, or disable
# it with `agents routines disable session-cache-warm`.
name: session-cache-warm
schedule: "*/3 * * * *"
enabled: true
timeout: 2m
command: agents __daemon-tick session-cache-warm
