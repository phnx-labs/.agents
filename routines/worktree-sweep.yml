# SAFETY. Four ways this can destroy the work it protects were found by review of
# the abandoned CLI version; each is closed below and none may be relaxed:
#   1. Facts are re-read immediately before every mutation, never from a snapshot
#      taken at the top of the sweep. A box with 136 worktrees takes minutes, and
#      an agent that COMMITS mid-sweep leaves a clean tree — a stale "0 unmerged"
#      would then authorise `branch -D` and destroy that commit.
#   2. An unreadable `git status` is INDETERMINATE, never "clean". An index.lock
#      held by a live agent lands exactly there, on the tree most likely to be
#      holding work.
#   3. Merge is judged by patch-id (`git cherry`), not ancestry: this fleet
#      rebase-merges, so a landed branch's SHAs are rewritten and
#      `merge-base --is-ancestor` reports NOT merged for work that fully landed.
#      Patch-id also subsumes the unpushed check — an unpushed commit has no
#      upstream equivalent.
#   4. Paths are compared on boundaries, so `fix-110` can never match `fix-1103`.
