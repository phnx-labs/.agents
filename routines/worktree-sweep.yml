# Built-in routine: reclaim PR-bound agent worktrees whose work has landed.
#
# Why this exists (PHNX-3503): worktree law puts every tracked change in
# <repo>/.agents/worktrees/<slug>/, and nothing ever removed one. `gh pr merge
# --delete-branch` drops the BRANCH and leaves the CHECKOUT, so every merged PR
# leaked a working tree — usually a few GB of node_modules. Measured 2026-08-30:
# 581 worktrees / ~263 GB across the fleet, which took the release home base to
# 1.6 GiB free and wedged publishing at phase [5/6] (PHNX-3478). yosemite-m5 was
# next, holding 71 GB of worktrees against 82 GB free.
#
# WHY THIS IS A ROUTINE AND NOT A CLI COMMAND. The agents surface is already 79
# top-level / 549 total commands; this is maintenance, not a user-facing verb, so
# it must not add an 80th. It can live here because a command routine is run by
# the daemon as `/bin/sh -c` with "no agent binary, no rotation, no sandbox"
# (cli/src/lib/daemon/runner.ts:881) — it never passes a PreToolUse hook, so
# git-guard's `git branch -d/-D` deny does not apply to it. That deny exists to
# stop an AGENT choosing branches to delete; here the branch is chosen by the
# merge. Agents keep zero branch-delete permission and gain no new command.
#
# NO `devices:` RESTRICTION, for the same reason the now-removed
# check-updates.yml (PHNX-3695) was also unpinned. Per §Scheduling & execution
# singularity an unrestricted routine MAY
# fire on every device when its input is the FIRING DEVICE'S OWN STATE. Worktree
# cleanup is exactly that: each box sweeps only its own checkouts, so there is no
# shared queue, no owner pin, and no double-fire. Pinning it to one device would
# clean that box and leave the other ten leaking — the failure being fixed.
#
# First run is NOT unattended: the sweep is driven by hand across the fleet
# (`--dry-run` first, output inspected, then the real pass) before this routine is
# enabled, so the nightly fire operates on an already-reconciled fleet rather than
# making its first several-hundred-worktree decision alone at 04:30.
#
# SAFETY. Five ways this can destroy the work it protects were found by review;
# each is closed in routines/lib/worktree-sweep.sh and none may be relaxed:
#   1. Facts are re-read immediately before every mutation, never from a snapshot
#      taken at the top of the sweep, and the merge proof is re-checked once more
#      against the BRANCH after the worktree is gone — `git worktree remove` only
#      refuses on uncommitted changes, never on unpushed commits, so it is not
#      the independent second opinion it looks like.
#   2. An unreadable `git status` is INDETERMINATE, never "clean". An index.lock
#      held by a live agent lands exactly there, on the tree most likely to be
#      holding work.
#   3. Merge is judged by patch-id (`git cherry`), not ancestry: this fleet
#      rebase-merges, so a landed branch's SHAs are rewritten and
#      `merge-base --is-ancestor` reports NOT merged for work that fully landed.
#      Patch-id also subsumes the unpushed check.
#   4. Paths are compared exactly, so `fix-110` can never match `fix-1103`.
#   5. Discovery matches directory SHAPE, so an ALLOWLIST on remote.origin.url —
#      anchored to host and exact org — gates which repos may be touched at all.
name: worktree-sweep
schedule: 30 4 * * *        # daily 04:30 (daemon-local time), off the work day
enabled: true
timeout: 20m
command: |
  # The logic lives in routines/lib/worktree-sweep.sh so it can be TESTED. This
  # job is destructive, and review found five ways earlier revisions could delete
  # work they existed to protect or silently do nothing at all; untestable inline
  # shell is how that recurs. Tests: routines/lib/tests/worktree-sweep_test.sh,
  # which drives the script under dash AND bash — the production interpreter is
  # /bin/sh (dash on the Linux boxes), and an earlier revision passed its suite
  # under bash while being a syntax error under the one that actually runs it.
  #
  # Grace window: to change it on one box, copy this routine to
  # ~/.agents/routines/worktree-sweep.yml and edit it there — that is the repo's
  # per-device override, so this reads no bespoke env var of its own.
  sh "$HOME/.agents/.system/routines/lib/worktree-sweep.sh" --grace-days 3
