name: worktree-sweep
schedule: 30 4 * * *        # daily 04:30 (daemon-local time), off the work day
enabled: true
timeout: 20m
command: |
  # The logic lives in routines/lib/worktree-sweep.sh so it can be TESTED. This
  # job is destructive, and review found five ways earlier revisions could delete
  # work they existed to protect or silently do nothing at all; untestable inline
  # shell is how that recurs. Tests: routines/lib/tests/worktree-sweep_test.sh,
  # which drives the script under dash AND bash — the production interpreter is
  # /bin/sh (dash on the Linux boxes), and an earlier revision passed its suite
  # under bash while being a syntax error under the one that actually runs it.
  #
  # Grace window: to change it on one box, copy this routine to
  # ~/.agents/routines/worktree-sweep.yml and edit it there — that is the repo's
  # per-device override, so this reads no bespoke env var of its own.
  sh "$HOME/.agents/.system/routines/lib/worktree-sweep.sh" --grace-days 3
