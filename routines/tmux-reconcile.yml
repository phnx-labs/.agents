# Built-in routine: retrofit the guarded tmux pane-died hook onto managed
# `agents run` sessions a pre-fix binary left with the old unconditional hook
# (RUSH-2353).
#
# Migrated off a hardcoded daemon setInterval (5 min). Non-destructive:
# set-hook only, never a kill or detach. A per-session schema marker makes
# steady-state a no-op. No-ops cleanly when tmux isn't installed.
#
# Users override it with a same-named file in ~/.agents/routines/, or disable
# it with `agents routines disable tmux-reconcile`.
name: tmux-reconcile
schedule: "*/5 * * * *"
enabled: true
timeout: 2m
command: agents __daemon-tick tmux-reconcile
