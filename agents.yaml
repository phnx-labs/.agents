hooks:
  mq-read-nudge:
    # PreToolUse on Read: when the agent is about to read a large (>=16 KiB)
    # supported file whole, inject a one-time (per session + per file)
    # suggestion to map it with `mq .tree` and extract only the needed section.
    # Advisory, never blocks; skips targeted reads (offset/limit) and small
    # files. Closes the reach-gap behind the measured pattern — mq used 0x
    # across 835 sessions / 3 days while 62% of tool calls were context reads.
    # Claude only — relies on PreToolUse additionalContext.
    agents:
      - claude
    events:
      - PreToolUse
    matcher: Read
    script: 10-mq-read-nudge.py
    timeout: 5
  session-start-autosync:
    agents:
      - claude
      - codex
      - gemini
    events:
      - SessionStart
    script: 05-session-start-autosync.sh
    timeout: 5
  verify-work-complete:
    agents:
      - claude
    events:
      - Stop
    script: 00-agent-verify-work-complete.sh
    timeout: 20
  inject-repo-inflight:
    agents:
      - claude
      - codex
      - gemini
    events:
      - SessionStart
    script: 08-inject-repo-inflight.sh
    timeout: 10
    # Measured 5648ms — 68% of SessionStart wall-clock on its own. It shells out to
    # `gh pr list` and `agents sessions`, so the cost is network + subprocess, not
    # compute. Keyed per-cwd because the payload is "open PRs and live sessions in THIS
    # checkout". 5m-bg serves the cached answer instantly and refreshes behind it, so
    # there is no staleness cliff. Also switches on `agents hooks profile` for this hook.
    cache:
      ttl: 5m
      key: per-cwd
      prefetch: background
  attention-sentinel:
    agents:
      - claude
    events:
      - Notification
      - Stop
      - UserPromptSubmit
    script: 06-attention-sentinel.sh
    timeout: 5
  escalate-on-notification:
    # Opt-in (owner.md `auto_escalate: true`): reach the user out-of-band per
    # their owner profile when an agent raises a needs-you Notification. Inert
    # until the owner turns it on, so it is safe to ship.
    agents:
      - claude
    events:
      - Notification
    script: 12-escalate-on-notification.sh
    timeout: 10
  inject-device-topology:
    agents:
      - claude
      - codex
      - gemini
    events:
      - SessionStart
    script: 07-inject-device-topology.sh
    timeout: 5
    # Measured 2255ms — probes every fleet device for load/memory. Fleet membership is
    # machine-wide, so the key is global; the load figures are advisory and a few minutes
    # stale is fine for "which box is idle". Same 5m-bg stale-while-revalidate.
    cache:
      ttl: 5m
      key: global
      prefetch: background
  session-identity:
    agents:
      - claude
      - codex
      - gemini
      - kimi
      - grok
      - antigravity
    events:
      - SessionStart
    script: 04-session-identity.sh
    timeout: 5
  mailbox-inject:
    agents:
      - claude
    events:
      - PreToolUse
    script: 09-mailbox-inject.py
    timeout: 5
  git-guard:
    agents:
      - claude
      - codex
      - gemini
    events:
      - PreToolUse
    matcher: Bash
    script: git-guard.sh
    timeout: 5
  rm-guard:
    agents:
      - claude
      - codex
      - gemini
    events:
      - PreToolUse
    matcher: Bash
    script: rm-guard.sh
    timeout: 5
  feed-forward:
    # Event-driven (no polling routine): when an agent posts a status update via
    # `agents feed post`, forward it to the owner's phone (rush iMessage, else
    # Telegram). Opt-in via owner.md (forward_status: true) — inert until on.
    agents:
      - claude
    events:
      - PostToolUse
    matcher: Bash
    script: 13-feed-forward.py
    timeout: 10
  git-require-clean-tree:
    agents:
      - claude
      - codex
      - gemini
    events:
      - PreToolUse
    matcher: Bash
    script: 01-git-require-clean-tree.sh
    timeout: 5
  # Restored: accidentally deleted by 606db6e (May 13 2026), a commit whose subject
  # was the pre-commit validator and which dropped 27 unrelated lines from this file.
  # All three scripts were verified working before re-registration.
  expand-promptcuts:
    events:
      - UserPromptSubmit
    script: 02-expand-prompt-user-shortcuts.sh
    timeout: 5
  expand-bang-commands:
    events:
      - UserPromptSubmit
    script: 02-expand-prompt-bang-commands.py
    timeout: 10
  linear-tasks:
    events:
      - SessionStart
    script: 03-linear-inject-tasks-context.sh
    timeout: 15
  # Restored: dropped by 8b006a6 ("remove legacy agents hook config", Jun 24 2026),
  # which removed rm-guard and large-file-add-guard together. rm-guard was later
  # re-registered; this one was forgotten. Verified blocking an 11 MiB `git add`.
  large-file-add-guard:
    events:
      - PreToolUse
    matcher: Bash
    script: large-file-add-guard.sh
    timeout: 5
