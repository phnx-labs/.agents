# System-layer hooks. Registration: agents-cli writes these into every
# hooks-capable agent version home on sync. The optional `agents:` field on each
# entry is DEPRECATED and IGNORED by agents-cli (types.ts ManifestHook) — do not
# use it to filter harnesses. Real coverage is per-event mapping in agents-cli
# (hooks.ts) + multi-harness stdin protocol in each script (snake_case Claude/
# Codex/Kimi/Cursor/Droid + camelCase Grok). Gemini CLI is hard-deprecated;
# use antigravity. Target harnesses: claude, codex, kimi, grok, cursor, droid,
# antigravity. See hooks/README.md §Multi-harness.

hooks:
  mq-read-nudge:
    # PreToolUse on Read: when the agent is about to read a large (>=16 KiB)
    # supported file whole, inject a one-time (per session + per file)
    # suggestion to map it with `mq .tree` and extract only the needed section.
    # Advisory, never blocks; skips targeted reads (offset/limit) and small
    # files. Closes the reach-gap behind the measured pattern — mq used 0x
    # across 835 sessions / 3 days while 62% of tool calls were context reads.
    # Advisory additionalContext; tool names Read/read_file/ReadFile (multi-harness).
    events:
      - PreToolUse
    matcher: Read
    script: pre-tool-use/10-mq-read-nudge.py
    timeout: 5
  session-start-autosync:
    events:
      - SessionStart
    script: session-start/05-session-start-autosync.sh
    timeout: 5

  # SessionStart: fast-forward the cwd git repo when the tree is clean.
  # Never force, never rebase over local commits, never autostash.
  git-pull-forward:
    events: [SessionStart]
    script: session-start/09-git-pull-forward.sh
    timeout: 20
  verify-work-complete:
    events:
      - Stop
    script: stop/00-agent-verify-work-complete.sh
    timeout: 20
  inject-repo-inflight:
    events:
      - SessionStart
    script: session-start/08-inject-repo-inflight.sh
    timeout: 10
    # NOT cached, deliberately. The hook excludes the CALLING session from the live-session
    # list (`self_sid`, 08-inject-repo-inflight.sh:72), so its correct output differs per
    # session. `per-cwd` keying drops session_id, which would serve agent B the snapshot
    # computed for agent A — filtered to exclude A, not B — so B would not see that A is
    # running, defeating the hook's stated purpose. `per-session` keying would be correct
    # but useless: SessionStart fires once per session, so every fire would be a miss.
    # Speed comes from parallelising its two probes inside the script instead.
  attention-sentinel:
    events:
      - Notification
      - Stop
      - UserPromptSubmit
    script: notification/06-attention-sentinel.sh
    timeout: 5
  escalate-on-notification:
    # Opt-in (owner.md `auto_escalate: true`): reach the user out-of-band per
    # their owner profile when an agent raises a needs-you Notification. Inert
    # until the owner turns it on, so it is safe to ship.
    events:
      - Notification
    script: notification/12-escalate-on-notification.sh
    timeout: 10
  inject-device-topology:
    events:
      - SessionStart
    script: session-start/07-inject-device-topology.sh
    timeout: 5
    # Measured 2255ms — probes every fleet device for load/memory. Safe to cache: the
    # output has no session or cwd dependency, so a shared entry is the correct answer for
    # every caller. Keyed global for that reason.
    #
    # TTL is 60s, not 5m: the load figures steer "prefer an idle box", and a 5-minute-old
    # reading can route work to a box that is now busy. 60s still absorbs the common case
    # (several sessions starting within a minute of each other) while bounding how wrong
    # the advice can be — and it bounds the blast radius of a background refresh that
    # keeps failing, which currently has no backoff and would otherwise serve one stale
    # entry indefinitely.
    cache:
      ttl: 60s
      key: global
      prefetch: background
  session-identity:
    events:
      - SessionStart
    script: session-start/04-session-identity.sh
    timeout: 5
  mailbox-inject:
    events:
      - PreToolUse
    script: pre-tool-use/09-mailbox-inject.py
    timeout: 5
  git-guard:
    events:
      - PreToolUse
    matcher: Bash
    script: pre-tool-use/git-guard.sh
    timeout: 5
  rm-guard:
    events:
      - PreToolUse
    matcher: Bash
    script: pre-tool-use/rm-guard.sh
    timeout: 5
  feed-forward:
    # Event-driven (no polling routine): when an agent posts a status update via
    # `agents feed post`, forward it to the owner via `agents notify` (else
    # Telegram). Opt-in via owner.md (forward_status: true) — inert until on.
    events:
      - PostToolUse
    matcher: Bash
    script: post-tool-use/13-feed-forward.py
    timeout: 10
  git-require-clean-tree:
    events:
      - PreToolUse
    matcher: Bash
    script: pre-tool-use/01-git-require-clean-tree.sh
    timeout: 5
  # Restored: accidentally deleted by 606db6e (May 13 2026), a commit whose subject
  # was the pre-commit validator and which dropped 27 unrelated lines from this file.
  # All three scripts were verified working before re-registration.
  expand-promptcuts:
    events:
      - UserPromptSubmit
    script: user-prompt-submit/02-expand-prompt-user-shortcuts.sh
    timeout: 5
  expand-bang-commands:
    events:
      - UserPromptSubmit
    script: user-prompt-submit/02-expand-prompt-bang-commands.py
    timeout: 10
  linear-tasks:
    events:
      - SessionStart
    script: session-start/03-linear-inject-tasks-context.sh
    timeout: 15
  # Restored: dropped by 8b006a6 ("remove legacy agents hook config", Jun 24 2026),
  # which removed rm-guard and large-file-add-guard together. rm-guard was later
  # re-registered; this one was forgotten. Verified blocking an 11 MiB `git add`.
  large-file-add-guard:
    events:
      - PreToolUse
    matcher: Bash
    script: pre-tool-use/large-file-add-guard.sh
    timeout: 5
