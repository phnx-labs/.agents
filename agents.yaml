# System-layer hooks. Registration: agents-cli writes these into every
# hooks-capable agent version home on sync. The optional `agents:` field on each
# entry is DEPRECATED and IGNORED by agents-cli (types.ts ManifestHook) — do not
# use it to filter harnesses. Real coverage is per-event mapping in agents-cli
# (hooks.ts) + multi-harness stdin protocol in each script (snake_case Claude/
# Codex/Kimi/Cursor/Droid + camelCase Grok). Gemini CLI is hard-deprecated;
# use antigravity. Target harnesses: claude, codex, kimi, grok, cursor, droid,
# antigravity. See hooks/README.md §Multi-harness.

hooks:
  visual-readback-nudge:
    # Advisory only: reminds once per artifact before a visual leaves the session.
    events: [PreToolUse]
    matcher: Bash
    script: pre-tool-use/11-visual-readback-nudge.py
    timeout: 5
  session-start-autosync:
    events:
      - SessionStart
    script: session-start/05-session-start-autosync.sh
    timeout: 5

  # SessionStart: fast-forward the cwd git repo when the tree is clean.
  # Never force, never rebase over local commits, never autostash.
  git-pull-forward:
    events: [SessionStart]
    script: session-start/09-git-pull-forward.sh
    timeout: 20
  verify-work-complete:
    events:
      - Stop
    script: stop/00-agent-verify-work-complete.sh
    timeout: 20
  verify-work-goal-boundary:
    # Persists a SHA-256 prompt fingerprint, transcript byte offset, and
    # session/launch identity in verify-work-complete's hook-owned SQLite DB.
    # No prompt text is retained.
    events:
      - UserPromptSubmit
    script: user-prompt-submit/04-verify-work-state.py
    timeout: 2
  inject-repo-inflight:
    events:
      - SessionStart
    script: session-start/08-inject-repo-inflight.sh
    # 18, not 10. Two sequential project-resolution calls (3s each) run before
    # the probes, and the probes themselves are now parallel, so the worst case
    # is 6 + max(gh 4, sessions 8) = 14s, plus runtime margin. It was already
    # wrong at 10: the probes used to be SEQUENTIAL at 4 + 8 = 12s.
    timeout: 18
    # NOT cached, deliberately. The hook excludes the CALLING session from the live-session
    # list (`self_sid`, 08-inject-repo-inflight.sh:72), so its correct output differs per
    # session. `per-cwd` keying drops session_id, which would serve agent B the snapshot
    # computed for agent A — filtered to exclude A, not B — so B would not see that A is
    # running, defeating the hook's stated purpose. `per-session` keying would be correct
    # but useless: SessionStart fires once per session, so every fire would be a miss.
    # Speed comes from parallelising its two probes inside the script instead.
  attention-sentinel:
    events:
      - Notification
      - Stop
      - UserPromptSubmit
    script: notification/06-attention-sentinel.sh
    timeout: 5
  inject-device-topology:
    events:
      - SessionStart
    script: session-start/07-inject-device-topology.sh
    timeout: 5
    # Measured 2255ms — probes every fleet device for load/memory. Safe to cache: the
    # output has no session or cwd dependency, so a shared entry is the correct answer for
    # every caller. Keyed global for that reason.
    #
    # TTL is 60s, not 5m: the load figures steer "prefer an idle box", and a 5-minute-old
    # reading can route work to a box that is now busy. 60s still absorbs the common case
    # (several sessions starting within a minute of each other) while bounding how wrong
    # the advice can be — and it bounds the blast radius of a background refresh that
    # keeps failing, which currently has no backoff and would otherwise serve one stale
    # entry indefinitely.
    cache:
      ttl: 60s
      key: global
      prefetch: background
  session-identity:
    events:
      - SessionStart
    script: session-start/04-session-identity.sh
    timeout: 5
  mailbox-inject:
    events:
      - PreToolUse
    script: pre-tool-use/09-mailbox-inject.py
    timeout: 5
  git-guard:
    events:
      - PreToolUse
    matcher: Bash
    script: pre-tool-use/git-guard.sh
    timeout: 5
  rm-guard:
    events:
      - PreToolUse
    matcher: Bash
    script: pre-tool-use/rm-guard.sh
    timeout: 5
  secrets-guard:
    events:
      - PreToolUse
    matcher: Bash
    script: pre-tool-use/secrets-guard.sh
    timeout: 5
  git-require-clean-tree:
    events:
      - PreToolUse
    matcher: Bash
    script: pre-tool-use/01-git-require-clean-tree.sh
    timeout: 5
  # Public feature name: promptcuts. The manifest key stays expand-promptcuts.
  # On by default (it always has been). To turn it off, put
  #   expand-promptcuts: {enabled: false, override: true}
  # under hooks: in ~/.agents/agents.yaml, then run `agents sync`.
  expand-promptcuts:
    events:
      - UserPromptSubmit
    script: user-prompt-submit/02-expand-prompt-user-shortcuts.sh
    timeout: 5
  # Public feature name: bangcuts. The manifest key stays expand-bang-commands.
  # ON by default as of RUSH-2405. This runs `!cmd` blocks found in a prompt
  # through the local shell, so every prompt source is a command source —
  # including one injected by a watchdog, a monitor, or another agent. Only
  # paste text you trust. To turn it off, put
  #   expand-bang-commands: {enabled: false, override: true}
  # under hooks: in ~/.agents/agents.yaml, then run `agents sync`.
  expand-bang-commands:
    events:
      - UserPromptSubmit
    script: user-prompt-submit/02-expand-prompt-bang-commands.sh
    timeout: 10
  vacation-recap:
    events:
      - UserPromptSubmit
    script: user-prompt-submit/03-vacation-recap.py
    timeout: 5
  # Owner directive (2026-08-15) after an agent wrote into a primary checkout
  # on main: keep the worktree law inside every context window, every prompt.
  # main-branch-guard stays the hard enforcement; this is the standing reminder.
  worktree-law-reminder:
    events:
      - UserPromptSubmit
    script: user-prompt-submit/05-worktree-law-reminder.sh
    timeout: 5
  linear-tasks:
    events:
      - SessionStart
    script: session-start/03-linear-inject-tasks-context.sh
    # 20, not 15: the brief curl (8s) + three sweep pages (3s) + the two bounded
    # project-resolution calls (6s) is a 17s worst case, and the sweep runs
    # BEFORE anything prints — an overrun delivers zero bytes, not a short brief.
    # The script's own test asserts this sum against this number, counting both
    # curl's --max-time and each `_to <secs>`, so the two move together.
    timeout: 20
  # Restored: dropped by 8b006a6 ("remove legacy agents hook config", Jun 24 2026),
  # which removed rm-guard and large-file-add-guard together. rm-guard was later
  # re-registered; this one was forgotten. Verified blocking an 11 MiB `git add`.
  large-file-add-guard:
    events:
      - PreToolUse
    matcher: Bash
    script: pre-tool-use/large-file-add-guard.sh
    timeout: 5
  # RUSH-3033 item 3. The GTM/monetization strategy was committed to
  # .agents/artifacts/ on the PUBLIC agents-cli repo and stayed world-readable
  # for ~2 days; the tip was cleaned but history still carries it. Two
  # documented rules compose into that leak — artifacts/ is "durable, committed"
  # while scratch/ is ignored, and the recap workflow tells agents to commit any
  # stray work they find. Local file checks only, no network: it must not add
  # latency to every git add.
  public-artifact-guard:
    events:
      - PreToolUse
    matcher: Bash
    script: pre-tool-use/public-artifact-guard.sh
    timeout: 5
