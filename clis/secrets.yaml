name: secrets
description: |
  Phoenix Labs secrets CLI — named bundles, macOS Keychain / file backends, and
  exec injection. Required by agents-cli after PHNX-3989 (the engine no longer
  ships inside agents). Binary is `secrets`. `agents secrets` is a passthrough
  to the same binary. Not 1Password `op`, not macOS `security`.
homepage: https://github.com/phnx-labs/secrets-cli

check: secrets --version

# Pin the published package. Bumping means editing this tag plus CHANGELOG.
install:
  - npm: "@phnx-labs/secrets-cli@0.1.4"

post_install: |
  secrets --version
  secrets list
  agents secrets list
  Agents inject with `agents run … --secrets <bundle>` or `secrets exec
  <bundle> -- <cmd>`. A locked keychain bundle read from the GUI session — by
  a human shell or by an agent the user is driving — raises one Touch ID
  sheet and is then held; `secrets unlock <bundle> --durable` keeps a hold
  across sleep too. Only an unattended run (AGENTS_RUNTIME=headless) or a
  process outside the GUI session (SSH, launchd, CI) stays broker-only and
  needs a prior `secrets unlock`. `agents secrets` and every agent launched
  by `agents run` use SECRETS_HOME=~/.agents; a bare `secrets` in your own
  terminal defaults to ~/.secrets unless you export SECRETS_HOME=~/.agents.
